<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>違規廣告快篩 · 已搬家</title>

<!-- 這一頁是「舊網址的轉址頁」，不是應用程式本體。
     GitHub Pages 是純靜態主機，沒有 301／302 可以設，所以轉址只能靠
     meta refresh + JS，並用 rel=canonical 告訴搜尋引擎正主是誰。

     套用方式（等改版告一段落再做）：
       copy deploy\github-pages-redirect.html docs\index.html
       git add docs\index.html && git commit -m "GitHub Pages 轉址到 taihao-ai-games.web.app/aiad"
       git push
     套用後 https://pyhsu-cyber.github.io/AI-Powered-Ad-Screening/ 會自動跳到新網址。
     docs\regulations.json 留著沒關係（沒有頁面會再讀它），要刪也可以。 -->
<link rel="canonical" href="https://taihao-ai-games.web.app/aiad/index.html">
<meta http-equiv="refresh" content="0; url=https://taihao-ai-games.web.app/aiad/index.html">
<meta name="robots" content="noindex,follow">

<style>
  :root{ --ink:#001642; --pink:#ef9bb0; --amber:#f6b255; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    display:flex;align-items:center;justify-content:center;
    background:var(--ink);
    background-image:radial-gradient(900px 520px at 80% -10%,rgba(246,178,85,.16),transparent 60%),
                     radial-gradient(760px 460px at 6% 110%,rgba(239,155,176,.16),transparent 60%);
    color:#fff;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    line-height:1.7;padding:24px;
  }
  .box{max-width:520px;width:100%;text-align:center}
  h1{font-size:clamp(21px,5.2vw,28px);margin:0 0 12px;font-weight:800}
  p{margin:0 0 18px;color:rgba(255,255,255,.82);font-size:15px}
  a.go{
    display:inline-block;padding:12px 22px;border-radius:999px;
    background:var(--amber);color:#3a2400;font-weight:800;text-decoration:none;
    word-break:break-all;
  }
  a.go:hover{filter:brightness(1.06)}
  .url{margin-top:16px;font-size:13px;color:rgba(255,255,255,.55);word-break:break-all}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pink);margin-right:8px;vertical-align:middle}
</style>
</head>
<body>
  <div class="box">
    <p><span class="dot"></span>違規廣告快篩</p>
    <h1>這個網址已經搬家</h1>
    <p>正在把你帶到新網址；沒有自動跳轉的話請點下面這顆按鈕。</p>
    <a class="go" id="go" href="https://taihao-ai-games.web.app/aiad/index.html">前往新網址 →</a>
    <div class="url">https://taihao-ai-games.web.app/aiad/index.html</div>
  </div>

<script>
/* 保留使用者原本帶的 ?query 與 #hash 再轉過去 —— meta refresh 會把它們丟掉。
   location.replace（而不是 assign）：不要在瀏覽紀錄留一格，
   否則使用者按「上一頁」會被彈回這裡再被轉走，形成迴圈。 */
(function () {
  var target = "https://taihao-ai-games.web.app/aiad/index.html";
  var tail = (location.search || "") + (location.hash || "");
  var url = target + tail;
  document.getElementById("go").href = url;
  location.replace(url);
})();
</script>
</body>
</html>
